name: Deploy MetaNest Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22

          script: |
            set -e

            cd /root/MetaNest

            git fetch origin
            git checkout main
            git reset --hard origin/main

            docker stop metanest-frontend || true
            docker rm metanest-frontend || true

            docker build -t metanest-frontend:latest .

            docker run -d \
              --name metanest-frontend \
              --restart unless-stopped \
              -p 3006:80 \
              metanest-frontend:latest

            docker ps --filter "name=metanest-frontend"
